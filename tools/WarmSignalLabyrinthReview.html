(()=>{'use strict';const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),btn=(label,act,attrs='',cls='soft',disabled=false)=>'<button data-act="'+act+'" '+attrs+' class="'+cls+'" '+(disabled?'disabled':'')+'>'+label+'</button>';let game,clock,ui,toastTimer;
function render(){$('screen').innerHTML=ui.screen();}function close(){$('modal').hidden=true;}function toast(t){clearTimeout(toastTimer);$('review-status').textContent=t;if(t)toastTimer=setTimeout(()=>$('review-status').textContent='',2500);}function modal(title,body,actions='',kicker='CHECK PREVIEW'){$('modal-title').textContent=title;$('modal-kicker').textContent=kicker;$('modal-body').innerHTML=body;$('modal-actions').innerHTML=actions;$('modal').hidden=false;}function commit(fn){const r=fn();if(!r.ok){toast(r.reason);return false;}render();return r;}
function scenario(kind){close();toast('');clock={at:Date.parse('2026-10-12T04:00:00Z')};game=new WarmEngine.Game(null,()=>clock.at,()=>0);game.s.main=kind==='locked'?29:55;game.s.gems=30000;game.s.energy=5000;game.s.arena.medals=2000;const rev=()=>game.s.labyrinth.serial,run=r=>{if(!r.ok)throw Error(r.reason);};if(kind!=='locked'){run(game.labyrinthAdmit('story',rev()));run(game.labyrinthBuyDice(rev(),WarmLabyrinth.month(clock.at)));run(game.labyrinthBuyCrystal(10,rev()));run(game.labyrinthDraw(5,10,rev()));run(game.labyrinthMail(rev()));const ids=game.s.cards.slice(0,3).map(c=>{c.level=60;c.stars=6;c.evolved=true;return c.id;});run(game.labyrinthExplore(0,ids,1,false,rev()));run(game.labyrinthRefill(0,10,rev()));run(game.labyrinthExplore(0,ids,10,true,rev()));run(game.labyrinthRead(0,0,rev()));if(kind==='ended'||kind==='rerun'||kind==='night'){clock.at=game.s.labyrinth.opening.ends;game.refresh();}if(kind==='rerun')run(game.labyrinthAdmit('dice',rev()));if(kind==='night'){run(game.labyrinthSelect(1,rev()));run(game.labyrinthAdmit('story',rev()));run(game.labyrinthBuyCrystal(10,rev()));run(game.labyrinthDraw(0,10,rev()));run(game.craft(126));run(game.labyrinthMail(rev()));run(game.labyrinthExplore(0,ids,1,false,rev()));run(game.labyrinthRefill(0,10,rev()));run(game.labyrinthExplore(0,ids,10,true,rev()));}}if(!WarmEngine.valid(game.s))throw Error('检查场景存档不合法');ui=WarmLabyrinthUI.create({getGame:()=>game,btn,esc,fmt:n=>n.toLocaleString('zh-CN'),cardArt:id=>WarmCardArt.markup(WarmData.cards[id],esc),modal,close,commit,toast,redraw:render,route:()=>toast('独立检查页：票房联动请在主游戏体验')});render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.scenario)return scenario(b.dataset.scenario);if(b.id==='close-modal'||b.dataset.act==='close')return close();if(b.dataset.go)return toast('独立检查页：正式入口位于主游戏');if(b.dataset.act)ui.act(b.dataset.act,b);});scenario('first');
