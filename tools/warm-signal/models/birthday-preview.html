<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生日盛装 · 动效检查</title><link rel="stylesheet" href="../companion.css?v=20261011-birthday-outfit-4"><style>
*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#795f55;font:14px 'Microsoft YaHei',sans-serif}main{max-width:700px;padding:18px;margin:auto}h1{font-size:21px;font-weight:500}p{font-size:12px;line-height:1.8}nav,.controls{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button{background:#f1e3d9;color:#81645a;border:1px solid #e2c8ba;border-radius:8px;padding:9px 12px;font:inherit;font-size:12px}button.active{background:#be8995;color:#fff8f2}.preview-wrap{display:flex;justify-content:center;background:linear-gradient(135deg,#efe1d4,#faf1e3);border:1px solid #e5cebb;border-radius:15px;overflow:hidden}#portrait{position:relative;width:min(360px,100%);aspect-ratio:2/3;margin:auto}#portrait.zoom{aspect-ratio:125/115}#portrait svg,#portrait canvas,.meet-art-motion,.meet-art-presence{position:absolute;inset:0;display:block;width:100%;height:100%}#portrait .meet-art-motion{animation:none!important}#portrait.rig-ready .meet-art-presence{visibility:hidden}.markers{pointer-events:none;z-index:5}output{display:block;font-size:11px;line-height:1.8;margin:12px 0;color:#9c8071}a{color:#a57384}
</style></head><body><main><a href="../../WarmSignal.html">返回游戏</a><h1>生日盛装 · 动效检查</h1><p>原始立绘、局部眨眼与嘴形对照。此页面不读写游戏存档；六套衣服仍需在游戏内达成条件领取。</p><nav id="people" aria-label="选择角色"></nav><div class="controls"><button id="zoom">面部放大</button><button id="markers">显示范围</button><button id="original">显示原画</button></div><div class="preview-wrap"><div id="portrait"></div></div><div class="controls"><button data-pose="neutral">自然表情</button><button data-pose="blink">眨眼定格</button><button data-pose="mouth">说话嘴形</button><button data-pose="auto">自动眨眼</button></div><output id="status" aria-live="polite"></output><p>关闭动效或设备不支持WebGL时，保留完整原画。生日裙装是静态插画，眼睛和嘴部采用局部网格动效。</p></main>
<script src="../character-art.js?v=20261011-birthday-outfit-4"></script><script src="../character-rig.js?v=20261011-birthday-outfit-4"></script><script>
const rig=WarmCharacterRig.create(),portrait=document.getElementById('portrait');let person=5,zoom=false,markers=false,original=false,pose='neutral';
function setPose(value){pose=value;rig.setBlink(value==='blink'?1:value==='auto'?null:0);rig.setMouth(value==='mouth'?.55:0);document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('active',b.dataset.pose===value));status();}
function status(){document.getElementById('status').textContent=WarmCharacterArt.names[person]+' · '+(original?'原画':{neutral:'自然表情',blink:'眨眼定格',mouth:'说话嘴形',auto:'自动眨眼'}[pose])+' · '+(zoom?'面部放大':'完整立绘');}
async function draw(){rig.dispose();portrait.innerHTML=WarmCharacterArt.markup(person,2,s=>s,'../assets/');portrait.classList.toggle('zoom',zoom);const view=zoom?[155,55,125,115]:[0,0,418,627],svg=portrait.querySelector('svg');svg.setAttribute('viewBox',view.map(v=>v*1024/418).join(' '));if(!original)await rig.mount(portrait,person,2,{base:'../assets/',motion:true,view});setPose(pose);if(markers){const face=WarmCharacterRig.models[person].faces[2],angle=Math.atan2(face.eyes[1][1]-face.eyes[0][1],face.eyes[1][0]-face.eyes[0][0])*180/Math.PI,shape=face.eyes.map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="13" ry="9" transform="rotate(${angle} ${x} ${y})"/>`).join('')+`<rect x="${face.mouth[0]-14}" y="${face.mouth[1]-6.5}" width="28" height="13"/>`;portrait.insertAdjacentHTML('beforeend',`<svg class="markers" viewBox="${view.join(' ')}" aria-hidden="true"><g fill="none" stroke="#b14c83" stroke-width=".5">${shape}</g></svg>`);}document.querySelectorAll('[data-person]').forEach(b=>b.classList.toggle('active',Number(b.dataset.person)===person));document.getElementById('zoom').textContent=zoom?'完整立绘':'面部放大';document.getElementById('markers').textContent=markers?'隐藏范围':'显示范围';document.getElementById('original').textContent=original?'显示局部动效':'显示原画';}
document.getElementById('people').innerHTML=WarmCharacterArt.names.map((n,p)=>`<button data-person="${p}">${n}</button>`).join('');document.getElementById('people').onclick=e=>{if(e.target.dataset.person!==undefined){person=Number(e.target.dataset.person);draw();}};document.getElementById('zoom').onclick=()=>{zoom=!zoom;draw();};document.getElementById('markers').onclick=()=>{markers=!markers;draw();};document.getElementById('original').onclick=()=>{original=!original;draw();};document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>setPose(b.dataset.pose));draw();
</script></body></html>
