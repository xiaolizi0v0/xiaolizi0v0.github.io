<button id="mute" class="secondary">静音</button></div><div class="status"><span>940 × 1672</span><span>25 fps</span><span>132 帧 · 5.28 秒</span><span>本机 GPU 生成</span></div><small>测试已完整覆盖对应音频。需要继续检查嘴部线条与肤色的稳定性，并补充环境运动、反应镜头和分支结果片段。此片段不代表整款游戏已达到商业成品质量。</small><p><a class="secondary" href="../AfterRain.html">审阅第一章剧情与竖屏界面 →</a></p></main><script>const v=document.getElementById('video'),p=document.getElementById('play');p.onclick=async()=>{if(v.paused){if(v.ended)v.currentTime=0;try{await v.play();}catch{p.textContent='轻触重新播放 ▶';}}else v.pause();};v.onplay=()=>p.textContent='暂停播放 Ⅱ';v.onpause=()=>p.textContent=v.ended?'重新播放 ↻':'继续播放 ▶';v.onended=()=>p.textContent='重新播放 ↻';document.getElementById('mute').onclick=e=>{v.muted=!v.muted;e.target.textContent=v.muted?'开启声音':'静音';};document.getElementById('caption-toggle').onclick=e=>{const c=document.getElementById('caption');c.hidden=!c.hidden;e.target.textContent=c.hidden?'显示字幕':'隐藏字幕';};document.addEventListener('visibilitychange',()=>{if(document.hidden)v.pause();});</script></body></html>
