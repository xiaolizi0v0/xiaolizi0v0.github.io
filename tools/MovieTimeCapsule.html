<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视剧观影存储时间胶囊 - 工具箱</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Host+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
    <style>
        .tool-container {
            max-width: 1240px;
            margin: 5rem auto;
            padding: 0 1.5rem 2rem;
        }

        /* ========== 顶部：标题 + 爱奇艺风格搜索栏 ========== */
        .tool-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1.5rem 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: var(--ds-font-display);
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--ds-text-primary);
            letter-spacing: -0.01em;
        }

        .brand i {
            color: var(--ds-brand);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--ds-bg-surface-1);
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-pill);
            padding: 0.35rem 0.35rem 0.35rem 1.1rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            width: min(480px, 100%);
        }

        .search-bar:focus-within {
            border-color: var(--ds-brand);
            box-shadow: 0 0 0 3px rgba(77, 107, 254, .15);
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-family: var(--ds-font-sans);
            color: var(--ds-text-primary);
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--ds-text-placeholder);
        }

        .search-bar button {
            background: var(--ds-brand);
            color: #fff;
            border: none;
            border-radius: var(--ds-radius-pill);
            padding: 0.55rem 1.5rem;
            font-size: 0.92rem;
            font-weight: 600;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .search-bar button:hover {
            background: #3f5eea;
        }

        .search-bar button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ========== 分类导航（爱奇艺风格频道栏） ========== */
        .category-nav {
            position: sticky;
            top: 68px;
            z-index: 60;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            padding: 0.6rem 1rem;
            background: var(--ds-bg-page);
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-panel);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .cat-tab {
            padding: 0.4rem 1.1rem;
            border: none;
            border-radius: var(--ds-radius-pill);
            background: transparent;
            color: var(--gray-500);
            font-size: 0.92rem;
            font-weight: 500;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .cat-tab:hover {
            color: var(--ds-text-primary);
            background: var(--ds-bg-surface-1);
        }

        .cat-tab.active {
            background: var(--ds-brand);
            color: #fff;
        }

        .nav-divider {
            width: 1px;
            height: 18px;
            background: var(--ds-border-strong);
            margin: 0 0.4rem;
        }

        /* 二级分类筛选 */
        .nav-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .nav-row.secondary {
            padding-top: 0.6rem;
            margin-top: 0.6rem;
            border-top: 1px solid var(--ds-border-subtle);
            gap: 0.9rem;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 0.78rem;
            color: var(--gray-400);
            white-space: nowrap;
            font-family: var(--ds-font-mono);
        }

        .filter-tabs {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 0.28rem 0.85rem;
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-pill);
            background: var(--ds-bg-surface-1);
            color: var(--gray-600);
            font-size: 0.8rem;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .filter-tab:hover {
            border-color: var(--ds-border-hover);
            color: var(--ds-text-primary);
        }

        .filter-tab.active {
            background: var(--ds-brand);
            border-color: var(--ds-brand);
            color: #fff;
        }

        .nav-actions {
            margin-left: auto;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .ghost-btn {
            padding: 0.45rem 1rem;
            background: transparent;
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-pill);
            color: var(--gray-600);
            font-size: 0.85rem;
            font-weight: 500;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .ghost-btn:hover {
            border-color: var(--ds-border-hover);
            color: var(--ds-text-primary);
            background: var(--ds-bg-surface-1);
        }

        /* ========== 搜索结果 ========== */
        .search-results {
            margin-bottom: 1.5rem;
        }

        .section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .section-label h2 {
            font-family: var(--ds-font-display);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--ds-text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-status {
            font-size: 0.9rem;
            color: var(--gray-500);
        }

        .search-status.error {
            color: var(--danger-color);
        }

        /* ========== 海报卡片（爱奇艺风格） ========== */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.1rem;
        }

        .poster-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: var(--ds-bg-surface-1);
            border: 1px solid var(--ds-border-subtle);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .poster-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, .12);
            border-color: var(--ds-border-hover);
        }

        .poster-wrap {
            position: relative;
            aspect-ratio: 2 / 3;
            background: var(--ds-bg-surface-3);
            overflow: hidden;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .poster-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .55) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0.9rem;
            opacity: 0;
            transition: opacity .25s ease;
        }

        .poster-card:hover .poster-overlay {
            opacity: 1;
        }

        .card-btn {
            padding: 0.45rem 1.1rem;
            background: var(--ds-brand);
            color: #fff;
            border: none;
            border-radius: var(--ds-radius-pill);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
        }

        .card-btn:hover {
            background: #3f5eea;
            transform: scale(1.04);
        }

        .card-btn.danger {
            background: rgba(255, 95, 87, .9);
        }

        .card-btn.danger:hover {
            background: #ff5f57;
        }

        .card-btn.recorded {
            background: var(--ds-bg-surface-3);
            color: var(--gray-500);
            cursor: default;
            box-shadow: none;
        }

        .poster-info {
            padding: 0.55rem 0.65rem 0.7rem;
        }

        .poster-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ds-text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .poster-meta {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
            font-size: 0.78rem;
            color: var(--gray-500);
            margin-top: 0.25rem;
        }

        .poster-meta .tag {
            background: var(--ds-bg-surface-3);
            border: 1px solid var(--ds-border-subtle);
            padding: 0.05rem 0.5rem;
            border-radius: var(--ds-radius-pill);
            font-size: 0.72rem;
            color: var(--gray-600);
        }

        .date-edit {
            border: 1px solid var(--ds-border-subtle);
            background: var(--ds-bg-page);
            color: var(--gray-600);
            border-radius: 6px;
            padding: 0.1rem 0.35rem;
            font-size: 0.76rem;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            max-width: 118px;
        }

        /* 评价与观影次数 */
        .rate-row {
            gap: 0.15rem;
            margin-top: 0.35rem;
        }

        .rate-btn,
        .tv-btn,
        .undo-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0.15rem 0.3rem;
            font-size: 0.82rem;
            color: var(--gray-400);
            font-family: var(--ds-font-sans);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.15rem;
        }

        .rate-btn:hover {
            color: var(--danger-color);
        }

        .rate-btn.active {
            color: var(--danger-color);
        }

        .rate-btn.done.active,
        .rate-btn[data-done].active {
            color: var(--success-color);
        }

        .tv-btn {
            color: var(--ds-brand-light);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .tv-btn:hover {
            color: var(--ds-brand);
            transform: scale(1.1);
        }

        .tv-btn span {
            font-size: 0.75rem;
            margin-left: 0.1rem;
        }

        .undo-btn {
            font-size: 0.72rem;
            color: var(--gray-300);
        }

        .undo-btn:hover {
            color: var(--gray-500);
        }

        .count-group {
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            margin-left: 0.35rem;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            color: var(--gray-400);
            border: 1px dashed var(--ds-border-strong);
            border-radius: var(--ds-radius-panel);
            margin-top: 0.5rem;
        }

        .empty-state i {
            font-size: 2.6rem;
            margin-bottom: 0.75rem;
            color: var(--ds-brand-light);
            opacity: .6;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        .hidden {
            display: none !important;
        }

        /* ========== 手动添加表单 ========== */
        .manual-form {
            display: grid;
            grid-template-columns: 1.4fr 0.7fr 0.7fr 0.9fr 0.9fr 1fr auto;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            background: var(--ds-bg-surface-1);
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-panel);
            box-shadow: var(--shadow-sm);
            align-items: center;
        }

        .manual-form input,
        .manual-form select {
            padding: 0.6rem 0.85rem;
            background: var(--ds-bg-page);
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-input);
            font-size: 0.9rem;
            font-family: var(--ds-font-sans);
            color: var(--ds-text-primary);
            transition: var(--transition);
        }

        .manual-form input:focus,
        .manual-form select:focus {
            outline: none;
            border-color: var(--ds-brand);
            box-shadow: 0 0 0 3px rgba(77, 107, 254, .15);
        }

        .manual-form select {
            cursor: pointer;
        }

        .tip {
            font-size: 0.78rem;
            color: var(--gray-400);
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .tool-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-bar {
                width: 100%;
            }

            .category-nav {
                position: static;
                gap: 0.3rem;
            }

            .nav-actions {
                margin-left: 0;
                width: 100%;
            }

            .manual-form {
                grid-template-columns: 1fr 1fr;
            }

            .poster-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 0.8rem;
            }
        }

        /* ========== 详情弹窗（小红书风格） ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 1.5rem;
            animation: modalFade .2s ease;
        }

        @keyframes modalFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            position: relative;
            background: var(--ds-bg-page);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
            width: 100%;
            max-width: 880px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalSlide .25s ease;
        }

        @keyframes modalSlide {
            from { transform: translateY(20px) scale(0.98); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .45);
            color: #fff;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, .7);
        }

        .modal-body {
            display: flex;
            flex-direction: row;
            overflow: hidden;
            max-height: 88vh;
        }

        .modal-image {
            flex: 0 0 42%;
            background: var(--ds-bg-surface-3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-side {
            flex: 1;
            min-width: 0;
            padding: 1.75rem 1.75rem 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .modal-title {
            font-family: var(--ds-font-display);
            font-size: 1.55rem;
            font-weight: 600;
            color: var(--ds-text-primary);
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .modal-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.7rem;
            font-size: 0.88rem;
            color: var(--gray-500);
        }

        .modal-meta .tag {
            background: var(--ds-bg-surface-3);
            border: 1px solid var(--ds-border-subtle);
            padding: 0.15rem 0.7rem;
            border-radius: var(--ds-radius-pill);
            font-size: 0.82rem;
            color: var(--gray-600);
        }

        .modal-desc {
            margin-top: 1.1rem;
            font-size: 0.96rem;
            line-height: 1.75;
            color: var(--gray-600);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .modal-extra {
            margin-top: 1.2rem;
            padding-top: 1.1rem;
            border-top: 1px solid var(--ds-border-subtle);
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .modal-field {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 0.9rem;
        }

        .modal-field label {
            color: var(--gray-500);
            min-width: 70px;
        }

        .modal-field .value {
            color: var(--ds-text-primary);
        }

        .modal-field input[type=date],
        .modal-field select {
            border: 1px solid var(--ds-border-subtle);
            background: var(--ds-bg-surface-1);
            color: var(--ds-text-primary);
            border-radius: 8px;
            padding: 0.35rem 0.6rem;
            font-size: 0.88rem;
            font-family: var(--ds-font-sans);
            cursor: pointer;
        }

        .modal-actions {
            margin-top: auto;
            padding-top: 1.5rem;
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .modal-actions .card-btn,
        .modal-actions .ghost-btn {
            padding: 0.6rem 1.3rem;
        }

        /* 弹窗右下角：评价与观影次数 */
        .modal-rate {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.4rem;
            margin-top: 1rem;
            padding-top: 0.9rem;
            border-top: 1px solid var(--ds-border-subtle);
        }

        .modal-rate .rate-btn,
        .modal-rate .tv-btn,
        .modal-rate .undo-btn {
            border: 1px solid var(--ds-border-subtle);
            background: var(--ds-bg-surface-1);
            border-radius: var(--ds-radius-pill);
            padding: 0.45rem 0.9rem;
            font-size: 0.85rem;
            color: var(--gray-500);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition);
        }

        .modal-rate .rate-btn:hover {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .modal-rate .rate-btn.active {
            color: #fff;
            background: var(--danger-color);
            border-color: var(--danger-color);
        }

        .modal-rate .rate-btn.done.active {
            background: var(--warning-color);
            border-color: var(--warning-color);
            color: #fff;
        }

        .modal-rate .tv-btn {
            color: var(--ds-brand-light);
            font-weight: 600;
        }

        .modal-rate .tv-btn:hover {
            background: var(--ds-brand);
            border-color: var(--ds-brand);
            color: #fff;
        }

        .modal-rate .tv-btn span {
            font-size: 0.85rem;
        }

        .modal-rate .undo-btn:hover {
            color: var(--ds-text-primary);
            border-color: var(--ds-border-hover);
        }

        @media (max-width: 640px) {
            .modal-body {
                flex-direction: column;
                overflow-y: auto;
            }
            .modal-image {
                flex: none;
                width: 100%;
                max-height: 55vh;
            }
            .modal-side {
                padding: 1.25rem 1.25rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">我的博客</a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="../index.html#home" class="nav-link">首页</a></li>
                <li class="nav-item"><a href="../index.html#about" class="nav-link">关于我</a></li>
                <li class="nav-item"><a href="../index.html#skills" class="nav-link">技能</a></li>
                <li class="nav-item"><a href="../index.html#projects" class="nav-link">项目</a></li>
                <li class="nav-item"><a href="../index.html#education" class="nav-link">教育</a></li>
                <li class="nav-item"><a href="index.html" class="nav-link active">工具箱</a></li>
                <li class="nav-item"><a href="../notes.html" class="nav-link">学习笔记</a></li>
                <li class="nav-item"><a href="../index.html#contact" class="nav-link">联系</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main>
        <div class="tool-container">
            <!-- 顶部：标题 + 搜索栏 -->
            <div class="tool-header">
                <div class="brand">
                    <i class="fas fa-clock"></i> 影视剧观影存储时间胶囊
                </div>
                <div class="search-bar">
                    <input id="search-input" type="text" placeholder="搜你想看的影视剧，如：肖申克的救赎" autocomplete="off">
                    <button id="search-btn"><i class="fas fa-search"></i> 搜索</button>
                </div>
            </div>
            <div class="tip">数据来自百度百科（JSONP 加载，无需代理），含海报缩略图。</div>

            <!-- 分类导航 -->
            <div class="category-nav" id="category-nav">
                <div class="nav-row">
                    <button class="cat-tab active" data-cat="all">全部</button>

            <!-- 已存片单 -->

                </div>

    <!-- 详情弹窗（小红书风格） -->
    <div class="modal-overlay hidden" id="detail-modal">
        <div class="modal">
            <button class="modal-close" id="modal-close" title="关闭"><i class="fas fa-times"></i></button>
            <div class="modal-body">
                <div class="modal-image" id="modal-image"></div>
                <div class="modal-side">
                    <h2 class="modal-title" id="modal-title"></h2>
                    <div class="modal-meta" id="modal-meta"></div>
                    <div class="modal-desc" id="modal-desc"></div>
                    <div class="modal-extra" id="modal-extra"></div>
                    <div class="modal-actions" id="modal-actions"></div>
                    <div class="modal-rate" id="modal-rate"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 我的个人博客. 保留所有权利.</p>
        </div>
    </footer>

    <script>
        // ===================== 数据存储 =====================
        const STORAGE_KEY = 'movieTimeCapsule';

        function loadRecords() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return Array.isArray(data) ? data : [];
            } catch (e) {
                return [];
            }
        }

        function saveRecords(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function nowDateStr() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        // ===================== 百度百科搜索（JSONP 加载，无需 CORS/代理） =====================
        function extractYear(s) {
            const m = s.match(/(?:19|20)\d{2}/);
            return m ? m[0] : '';
        }

        function detectType(s) {
            // 小说 / 漫画等非影视条目
            if (/创作.{0,8}?(小说|漫画)|系列小说|轻小说|长篇漫画/.test(s)) return 'other';
            // 综艺
            if (/综艺|真人秀|脱口秀|选秀|访谈节目/.test(s)) return 'variety';
            // 动画电影归为电影，纯动画/动漫归为动漫
            if (/动画电影/.test(s)) return 'movie';
            if (/动画|动漫|番剧/.test(s)) return 'anime';
            // 电视剧（"执导/主演的...剧"，要求"剧"是类型词组末字，避免误匹配"剧情片"）
            if (/电视剧|网络剧|网剧|(?:执导|主演)的[\u4e00-\u9fa5]{0,10}?剧(?![一-龥])/.test(s)) return 'tv';
            // 电影
            if (/(?:执导|主演)的[\u4e00-\u9fa5]{0,10}?片|电影|影片|纪录片/.test(s)) return 'movie';
            // 都不匹配 → 非影视，过滤掉
            return 'other';
        }

        // 从百科信息卡中提取类型（如：犯罪 剧情）
        function extractGenre(d) {
            const card = d.card || [];
            // 兼容不同类型卡片的字段名：类型 / 作品类型 / 节目类型 / 影片类型 …
            const entry = card.find(c => /类型$/.test(c.name || ''));
            if (!entry || !entry.value || !entry.value[0]) return '';
            // 去掉 <sup>上标引用</sup>、<a>标签及残留标签
            const raw = entry.value[0]
                .replace(/<sup[^>]*>[\s\S]*?<\/sup>/g, '')
                .replace(/<[^>]*>/g, '')
                .replace(/\s+/g, ' ');
            const parts = raw.split(/[、，,]/).map(s => s.trim()).filter(Boolean);
            return parts.slice(0, 3).join(' ');
        }

        // 把类型字符串渲染成独立的小徽章标签
        function genreChips(g) {
            if (!g) return '';
            return g.split(/\s+/).filter(Boolean)
                .map(x => `<span class="tag">${x}</span>`).join('');
        }

        // 平台名 → 统一标准平台
        const PLATFORM_MAP = {
            '爱奇艺': '爱奇艺',
            'iqiyi': '爱奇艺',
            '腾讯视频': '腾讯',
            '腾讯': '腾讯',
            '优酷网': '优酷',
            '优酷': '优酷',
            'bilibili': 'B站',
            '哔哩哔哩': 'B站',
            '芒果tv': '芒果TV',
            '芒果': '芒果TV',
            '电影院': '影院',
            '院线': '影院',
            '影院': '影院'
        };

        // 从百科信息卡中提取观看平台（在线播放平台 / 网络播放平台 / 播出平台 …）
        function extractPlatform(d) {
            const card = d.card || [];
            const entry = card.find(c => /平台$/.test(c.name || ''));
            if (!entry || !entry.value || !entry.value[0]) return '';
            const raw = entry.value[0]
                .replace(/<sup[^>]*>[\s\S]*?<\/sup>/g, '')
                .replace(/<[^>]*>/g, '')
                .replace(/\s+/g, '');
            const names = raw.split(/[、，,]/).map(s => s.trim()).filter(Boolean);
            for (const n of names) {
                const lower = n.toLowerCase();
                for (const [k, v] of Object.entries(PLATFORM_MAP)) {
                    const kl = k.toLowerCase();
                    if (lower.includes(kl) || kl.includes(lower)) return v;
                }
            }
            return names.length ? '其他' : '';
        }

        // 生成百度 CDN 缩略图 URL（限宽 300px）
        function thumbnailize(imgUrl) {
            if (!imgUrl) return '';
            const base = imgUrl.split('?')[0];
            return base + '?x-bce-process=image/resize,w_300,limit_1/format,f_auto';
        }

        // JSONP 加载器：通过 <script> 标签请求，绕过 CORS 限制
        function jsonp(url, cbParam, timeout, charset) {
            return new Promise((resolve, reject) => {
                const cb = 'bkcb' + Date.now() + Math.floor(Math.random() * 1000);
                const script = document.createElement('script');
                if (charset) script.charset = charset;
                const timer = setTimeout(() => {
                    delete window[cb];
                    script.remove();
                    reject(new Error('请求超时'));
                }, timeout || 12000);
                window[cb] = (data) => {
                    clearTimeout(timer);
                    delete window[cb];
                    script.remove();
                    resolve(data);
                };
                script.onerror = () => {
                    clearTimeout(timer);
                    delete window[cb];
                    script.remove();
                    reject(new Error('加载失败'));
                };
                script.src = url + '&' + cbParam + '=' + cb;
                document.head.appendChild(script);
            });
        }

        // 搜索百度百科词条（建议词 + 用户原始输入 精确匹配，再逐个查详情）
        async function searchBaidu(keyword) {
            const userInput = keyword.trim();

            // 1. 获取建议词（该接口返回 GBK 编码，强制按 GBK 解码）
            const sug = await jsonp(
                'https://suggestion.baidu.com/su?wd=' + encodeURIComponent(userInput) + '&prod=baike',
                'cb',
                12000,
                'gbk'
            );
            // 把用户原始输入也作为一个候选（精确匹配），与建议词合并去重
            const candidates = [...new Set([userInput, ...((sug && sug.s) || [])])].slice(0, 6);

            // 2. 并行查询每个词条详情（含海报、年份、类型、简介）
            const list = await Promise.all(candidates.map(async name => {
                try {
                    const d = await jsonp(
                        'https://baike.baidu.com/api/openapi/BaikeLemmaCardApi?scope=103&format=json&appid=379020'
                            + '&bk_key=' + encodeURIComponent(name) + '&bk_length=300',
                        'callback'
                    );
                    if (!d || !d.title) return null;
                    const text = (d.desc || '') + ' ' + (d.abstract || '');
                    const type = detectType(text);
                    return {
                        id: 'baike-' + d.id,
                        title: d.title,
                        year: extractYear(text),
                        type: type,
                        url: d.url || 'https://baike.baidu.com/item/' + encodeURIComponent(d.title),
                        img: thumbnailize(d.image),
                        genre: extractGenre(d),
                        platform: extractPlatform(d),
                        sub_title: '',
                        desc: (d.abstract || d.desc || '').slice(0, 140)
                    };
                } catch (e) {
                    return null;
                }
            }));

            // 过滤：1) 字段缺失 2) 非影视词条（如文化术语、耐火砖、方言等）
            // 同时按 id 去重（同一个词条被建议词+用户输入重复加入）
            const seen = new Set();
            return list.filter(Boolean).filter(r => {
                if (r.type === 'other') return false;
                if (seen.has(r.id)) return false;
                seen.add(r.id);
                return true;
            });
        }

        async function searchMovies(keyword) {
            const list = await searchBaidu(keyword);
            if (list.length === 0) {
                throw new Error('未找到影视词条（百度百科默认词条非影视已过滤）。若为动漫/剧集，可尝试更精确名称或直接手动添加。');
            }
            return list;
        }

        // ===================== 页面逻辑 =====================
        let records = loadRecords();
        let currentCat = 'all';        // all / movie / tv / variety / anime
        let currentGenre = '';         // 题材（二级）
        let currentPlatform = '';      // 平台（二级）
        let currentEra = '';           // 年代（二级）

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const searchStatus = document.getElementById('search-status');
        const searchResults = document.getElementById('search-results');
        const resultsGrid = document.getElementById('results-grid');
        const savedList = document.getElementById('saved-list');
        const emptyState = document.getElementById('empty-state');
        const savedCount = document.getElementById('saved-count');
        const genreTabs = document.getElementById('genre-tabs');
        const platformTabs = document.getElementById('platform-tabs');
        const eraTabs = document.getElementById('era-tabs');

        // 平台可选项
        const PLATFORMS = ['影院', '爱奇艺', '腾讯', '优酷', 'B站', '芒果TV', '其他'];
        // 年代区间
        const ERAS = ['2020后', '2010s', '2000s', '更早'];

        function typeName(t) {
            return { movie: '电影', tv: '电视剧', variety: '综艺', anime: '动漫', other: '其他' }[t] || '电影';
        }

        function eraOf(year) {
            const y = parseInt(year);
            if (!y) return '';
            if (y >= 2020) return '2020后';
            if (y >= 2010) return '2010s';
            if (y >= 2000) return '2000s';
            return '更早';
        }

        // 海报加载失败时替换为占位图标
        function posterError(el) {
            el.onerror = null;
            const holder = document.createElement('div');
            holder.className = 'poster-wrap';
            holder.style.cssText = 'display:flex;align-items:center;justify-content:center;color:var(--gray-400);aspect-ratio:2/3;';
            holder.innerHTML = '<i class="fas fa-film" style="font-size:2.2rem;"></i>';
            el.parentNode.replaceChild(holder, el);
        }

        // 详情弹窗（小红书风格）：mode = 'result' / 'saved'
        const modalEl = document.getElementById('detail-modal');

        function openModal(data, mode) {
            const recorded = records.some(r => r.id === String(data.id));

            document.getElementById('modal-title').textContent = data.title || '未命名';
            const metaEl = document.getElementById('modal-meta');
            metaEl.innerHTML = `
                <span class="tag">${typeName(data.type)}</span>
                ${data.year ? `<span>${data.year}</span>` : ''}
                ${genreChips(data.genre)}
            `;

            const imgWrap = document.getElementById('modal-image');
            if (data.img) {
                imgWrap.innerHTML = `<img src="${data.img}" alt="${data.title}" referrerpolicy="no-referrer" onerror="posterError(this)">`;
            } else {
                imgWrap.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;color:var(--gray-400);width:100%;height:100%;"><i class="fas fa-film" style="font-size:4rem;"></i></div>';
            }

            const descEl = document.getElementById('modal-desc');
            descEl.textContent = data.desc || data.sub_title || '暂无简介';
            descEl.style.display = data.desc || data.sub_title ? '' : 'none';

            // 评价与观影次数区（仅已存记录显示，右下角）
            document.getElementById('modal-rate').innerHTML = '';

            const extraEl = document.getElementById('modal-extra');
            const extraParts = [];
            if (mode === 'saved') {
                extraParts.push(`<div class="modal-field"><label>观看日期</label><input type="date" id="modal-date" value="${data.watchedDate || ''}"></div>`);
                const platformOpts = ['<option value="">未设置</option>']
                    .concat(PLATFORMS.map(p => `<option value="${p}" ${p === (data.platform || '') ? 'selected' : ''}>${p}</option>`));
                extraParts.push(`<div class="modal-field"><label>观看平台</label><select id="modal-platform">${platformOpts.join('')}</select></div>`);
                if (data.note) extraParts.push(`<div class="modal-field"><label>备注</label><div class="value">${data.note}</div></div>`);
            }
            extraEl.innerHTML = extraParts.join('');
            extraEl.style.display = extraParts.length ? '' : 'none';

            const actEl = document.getElementById('modal-actions');
            const baike = data.url ? `<a class="ghost-btn" href="${data.url}" target="_blank" rel="noopener noreferrer"><i class="fas fa-external-link-alt"></i> 查看百科</a>` : '';
            if (mode === 'result') {
                actEl.innerHTML = `
                    <button class="card-btn ${recorded ? 'recorded' : ''}" id="modal-record-btn" ${recorded ? 'disabled' : ''}>
                        ${recorded ? '已记录' : '记录观看'}
                    </button>
                    ${baike}
                `;
                if (!recorded) {
                    document.getElementById('modal-record-btn').addEventListener('click', () => {
                        addRecord({
                            id: String(data.id),
                            title: data.title || '未知作品',
                            year: data.year || '',
                            type: data.type === 'tv' ? 'tv' : (data.type === 'variety' ? 'variety' : (data.type === 'anime' ? 'anime' : 'movie')),
                            url: data.url || '',
                            img: data.img || '',
                            genre: data.genre || '',
                            platform: data.platform || '',
                            sub_title: data.sub_title || '',
                            desc: data.desc || ''
                        });
                        const btn = document.getElementById('modal-record-btn');
                        btn.classList.add('recorded');
                        btn.textContent = '已记录';
                        btn.disabled = true;
                    });
                }
            } else {
                // saved
                actEl.innerHTML = `
                    ${baike}
                    <button class="card-btn danger" id="modal-delete-btn"><i class="fas fa-trash-alt"></i> 删除记录</button>
                `;
                const dateInput = document.getElementById('modal-date');
                if (dateInput) {
                    dateInput.addEventListener('change', () => {
                        data.watchedDate = dateInput.value;
                        saveRecords(records);
                    });
                }
                const platformInput = document.getElementById('modal-platform');
                if (platformInput) {
                    platformInput.addEventListener('change', () => {
                        data.platform = platformInput.value;
                        saveRecords(records);
                        renderSaved();
                    });
                }

                // 右下角：点赞 / 拉完了 / 观影次数 + 撤回
                const rateEl = document.getElementById('modal-rate');
                rateEl.innerHTML = `
                    <button class="rate-btn ${data.liked ? 'active' : ''}" id="modal-like" title="点赞"><i class="fas fa-heart"></i> 点赞</button>
                    <button class="rate-btn done ${data.done ? 'active' : ''}" id="modal-done" title="拉完了（不好看）"><i class="fas fa-thumbs-down"></i> 拉完了</button>
                    <button class="undo-btn" id="modal-dec" title="撤回一次观影次数"><i class="fas fa-undo"></i> 撤回</button>
                    <button class="tv-btn" id="modal-inc" title="点击增加一次观影次数"><i class="fas fa-tv"></i> <span id="modal-count">${data.count || 1}</span></button>
                `;
                document.getElementById('modal-like').addEventListener('click', () => {
                    data.liked = data.liked ? 0 : 1;
                    if (data.liked) data.done = 0;   // 与"拉完了"互斥
                    saveRecords(records);
                    document.getElementById('modal-like').classList.toggle('active', !!data.liked);
                    document.getElementById('modal-done').classList.toggle('active', !!data.done);
                });
                document.getElementById('modal-done').addEventListener('click', () => {
                    data.done = data.done ? 0 : 1;
                    if (data.done) data.liked = 0;   // 与"点赞"互斥
                    saveRecords(records);
                    document.getElementById('modal-like').classList.toggle('active', !!data.liked);
                    document.getElementById('modal-done').classList.toggle('active', !!data.done);
                });
                document.getElementById('modal-inc').addEventListener('click', () => {
                    data.count = (data.count || 1) + 1;
                    saveRecords(records);
                    document.getElementById('modal-count').textContent = data.count;
                });
                document.getElementById('modal-dec').addEventListener('click', () => {
                    data.count = Math.max(1, (data.count || 1) - 1);
                    saveRecords(records);
                    document.getElementById('modal-count').textContent = data.count;
                });

                document.getElementById('modal-delete-btn').addEventListener('click', () => {
                    if (confirm('确定删除这条观影记录吗？')) {
                        const idx = records.findIndex(r => r.id === data.id);
                        if (idx >= 0) {
                            records.splice(idx, 1);
                            saveRecords(records);
                        }
                        closeModal();
                        renderSaved();
                    }
                });
            }

            modalEl.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalEl.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // 点击遮罩关闭、ESC 关闭
        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) closeModal();
        });
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modalEl.classList.contains('hidden')) closeModal();
        });

        // ========== 分类过滤 ==========
        function filteredRecords() {
            return records.filter(r => {
                if (currentCat !== 'all' && r.type !== currentCat) return false;
                if (currentGenre) {
                    const g = (r.genre || '').split(/\s+/).filter(Boolean);
                    if (!g.includes(currentGenre)) return false;
                }
                if (currentPlatform && (r.platform || '') !== currentPlatform) return false;
                if (currentEra && eraOf(r.year) !== currentEra) return false;
                return true;
            });
        }

        // 题材筛选（动态生成）
        function renderGenreTabs() {
            const genres = [...new Set(records.flatMap(r => (r.genre || '').split(/\s+/).filter(Boolean)))].slice(0, 12);
            genreTabs.innerHTML =
                `<button class="filter-tab ${currentGenre === '' ? 'active' : ''}" data-g="__all">全部</button>` +
                genres.map(g =>
                    `<button class="filter-tab ${g === currentGenre ? 'active' : ''}" data-g="${g}">${g}</button>`
                ).join('');
            genreTabs.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentGenre = tab.dataset.g === '__all' ? '' : tab.dataset.g;
                    renderGenreTabs();
                    renderSaved();
                });
            });
        }

        // 平台筛选（固定选项）
        function renderPlatformTabs() {
            platformTabs.innerHTML =
                `<button class="filter-tab ${currentPlatform === '' ? 'active' : ''}" data-p="__all">全部</button>` +
                PLATFORMS.map(p =>
                    `<button class="filter-tab ${p === currentPlatform ? 'active' : ''}" data-p="${p}">${p}</button>`
                ).join('');
            platformTabs.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentPlatform = tab.dataset.p === '__all' ? '' : tab.dataset.p;
                    renderPlatformTabs();
                    renderSaved();
                });
            });
        }

        // 年代筛选（固定选项）
        function renderEraTabs() {
            eraTabs.innerHTML =
                `<button class="filter-tab ${currentEra === '' ? 'active' : ''}" data-e="__all">全部</button>` +
                ERAS.map(e =>
                    `<button class="filter-tab ${e === currentEra ? 'active' : ''}" data-e="${e}">${e}</button>`
                ).join('');
            eraTabs.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentEra = tab.dataset.e === '__all' ? '' : tab.dataset.e;
                    renderEraTabs();
                    renderSaved();
                });
            });
        }

        // ========== 渲染已存片单（爱奇艺风格海报墙） ==========
        function renderSaved() {
            renderGenreTabs();
            renderPlatformTabs();
            renderEraTabs();
            const list = filteredRecords();
            list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            savedCount.textContent = records.length;

            if (records.length === 0) {
                savedList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            if (list.length === 0) {
                savedList.innerHTML = `<div class="empty-state" style="grid-column:1/-1;border:none;">
                    <i class="fas fa-filter"></i><p>当前分类下没有记录</p></div>`;
                return;
            }

            savedList.innerHTML = list.map((r) => `
                <div class="poster-card" data-mid="${r.id}">
                    <div class="poster-wrap">
                        ${r.img
                            ? `<img class="poster-img" src="${r.img}" alt="${r.title}" loading="lazy" referrerpolicy="no-referrer" onerror="posterError(this)">`
                            : `<div style="display:flex;align-items:center;justify-content:center;color:var(--gray-400);width:100%;height:100%;"><i class="fas fa-film" style="font-size:2.2rem;"></i></div>`}
                        <div class="poster-overlay">
                            <button class="card-btn danger" data-del="${r.id}" title="删除记录" onclick="event.stopPropagation()"><i class="fas fa-trash-alt"></i> 删除</button>
                        </div>
                    </div>
                    <div class="poster-info">
                        <div class="poster-title" title="${r.title}">${r.title || '未命名'}</div>
                        <div class="poster-meta">
                            <span class="tag">${typeName(r.type)}</span>
                            ${r.year ? `<span>${r.year}</span>` : ''}
                            ${genreChips(r.genre)}
                            ${r.platform ? `<span><i class="fas fa-tv"></i> ${r.platform}</span>` : ''}
                        </div>
                        <div class="poster-meta">
                            <i class="fas fa-calendar-alt"></i>
                            <input type="date" class="date-edit" value="${r.watchedDate || ''}" data-date="${r.id}">
                        </div>
                    </div>
                </div>
            `).join('');

            // 卡片点击打开弹窗
            savedList.querySelectorAll('.poster-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.mid;
                    const rec = records.find(r => r.id === id);
                    if (rec) openModal(rec, 'saved');
                });
            });

            // 删除（按 id 定位，避免筛选后索引错位）
            savedList.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.del;
                    if (confirm('确定删除这条观影记录吗？')) {
                        const idx = records.findIndex(r => r.id === id);
                        if (idx >= 0) {
                            records.splice(idx, 1);
                            saveRecords(records);
                            renderSaved();
                        }
                    }
                });
            });

            // 修改观看日期
            savedList.querySelectorAll('.date-edit').forEach(inp => {
                inp.addEventListener('change', () => {
                    const id = inp.dataset.date;
                    const rec = records.find(r => r.id === id);
                    if (rec) {
                        rec.watchedDate = inp.value;
                        saveRecords(records);
                    }
                });
            });
        }

        // ========== 渲染搜索结果（爱奇艺风格海报墙） ==========
        function renderResults(list) {
            if (!list.length) {
                resultsGrid.innerHTML = '';
                searchResults.classList.add('hidden');
                searchStatus.textContent = '没有找到相关词条，可手动添加。';
                searchStatus.className = 'search-status error';
                return;
            }
            searchResults.classList.remove('hidden');
            searchStatus.className = 'search-status';
            searchStatus.textContent = `找到 ${list.length} 条结果（百度百科）`;

            resultsGrid.innerHTML = list.map((item, idx) => {
                const recorded = records.some(r => r.id === String(item.id));
                return `
                <div class="poster-card" data-modal-idx="${idx}">
                    <div class="poster-wrap">
                        ${item.img
                            ? `<img class="poster-img" src="${item.img}" alt="${item.title}" loading="lazy" referrerpolicy="no-referrer" onerror="posterError(this)">`
                            : `<div style="display:flex;align-items:center;justify-content:center;color:var(--gray-400);width:100%;height:100%;"><i class="fas fa-film" style="font-size:2.2rem;"></i></div>`}
                        <div class="poster-overlay">
                            <button class="card-btn ${recorded ? 'recorded' : ''}" data-record="${idx}" ${recorded ? 'disabled' : ''} onclick="event.stopPropagation()">
                                ${recorded ? '已记录' : '记录观看'}
                            </button>
                        </div>
                    </div>
                    <div class="poster-info">
                        <div class="poster-title" title="${item.title}">${item.title}</div>
                        <div class="poster-meta">
                            <span class="tag">${typeName(item.type)}</span>
                            ${item.year ? `<span>${item.year}</span>` : ''}
                            ${genreChips(item.genre)}
                        </div>
                        ${item.desc ? `<div class="poster-meta" title="${item.desc}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.desc}</div>` : ''}
                    </div>
                </div>`;
            }).join('');

            // 卡片点击打开弹窗
            resultsGrid.querySelectorAll('.poster-card').forEach(card => {
                card.addEventListener('click', () => {
                    const i = parseInt(card.dataset.modalIdx);
                    openModal(list[i], 'result');
                });
            });

            resultsGrid.querySelectorAll('.card-btn:not(.recorded)').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = list[parseInt(btn.dataset.record)];
                    addRecord({
                        id: String(item.id),
                        title: item.title || '未知作品',
                        year: item.year || '',
                        type: item.type === 'tv' ? 'tv' : (item.type === 'variety' ? 'variety' : (item.type === 'anime' ? 'anime' : 'movie')),
                        url: item.url || '',
                        img: item.img || '',
                        genre: item.genre || '',
                        platform: item.platform || '',
                        sub_title: item.sub_title || '',
                        desc: item.desc || ''
                    });
                    btn.classList.add('recorded');
                    btn.textContent = '已记录';
                    btn.disabled = true;
                });
            });
        }

        function addRecord(rec) {
            const record = Object.assign({
                id: 'manual-' + Date.now(),
                title: '',
                year: '',
                type: 'movie',
                url: '',
                img: '',
                genre: '',
                platform: '',
                sub_title: '',
                desc: '',
                note: '',
                liked: 0,
                done: 0,
                count: 1,
                watchedDate: nowDateStr(),
                timestamp: Date.now()
            }, rec);
            if (!record.watchedDate) record.watchedDate = nowDateStr();
            if (!record.timestamp) record.timestamp = Date.now();

            if (!records.some(r => r.id === record.id)) {
                records.push(record);
            }
            saveRecords(records);
            renderSaved();
        }

        // ========== 搜索 ==========
        async function doSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchStatus.textContent = '请输入影视剧名称';
                searchStatus.className = 'search-status error';
                return;
            }
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 搜索中';
            searchStatus.textContent = '正在搜索百度百科...';
            searchStatus.className = 'search-status';
            searchResults.classList.remove('hidden');

            try {
                const list = await searchMovies(keyword);
                renderResults(list);
            } catch (e) {
                searchResults.classList.remove('hidden');
                searchStatus.className = 'search-status error';
                searchStatus.textContent = e.message || '搜索失败';
                resultsGrid.innerHTML = '';
                // 搜不到时预填手动添加表单，方便快速记录
                document.getElementById('m-title').value = keyword;
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fas fa-search"></i> 搜索';
            }
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        // 关闭搜索结果
        document.getElementById('close-search').addEventListener('click', () => {
            searchResults.classList.add('hidden');
            resultsGrid.innerHTML = '';
        });

        // ========== 分类切换 ==========
        document.getElementById('category-nav').addEventListener('click', e => {
            const tab = e.target.closest('.cat-tab');
            if (!tab) return;
            currentCat = tab.dataset.cat;
            currentGenre = '';
            currentPlatform = '';
            currentEra = '';
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t === tab));
            renderSaved();
        });

        // ========== 手动添加 ==========
        document.getElementById('toggle-manual').addEventListener('click', () => {
            document.getElementById('manual-form').classList.toggle('hidden');
        });

        document.getElementById('m-save').addEventListener('click', () => {
            const title = document.getElementById('m-title').value.trim();
            if (!title) {
                alert('请填写名称');
                return;
            }
            addRecord({
                id: 'manual-' + Date.now(),
                title: title,
                year: document.getElementById('m-year').value.trim(),
                type: document.getElementById('m-type').value,
                genre: document.getElementById('m-genre').value.trim(),
                platform: document.getElementById('m-platform').value,
                note: document.getElementById('m-note').value.trim()
            });
            document.getElementById('m-title').value = '';
            document.getElementById('m-year').value = '';
            document.getElementById('m-genre').value = '';
            document.getElementById('m-platform').value = '';
            document.getElementById('m-note').value = '';
            document.getElementById('manual-form').classList.add('hidden');
        });

        // ========== 导出 / 导入 JSON ==========
        document.getElementById('export-btn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `观影时间胶囊_${nowDateStr()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });

        document.getElementById('import-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    const list = Array.isArray(data) ? data : (data.records || []);
                    let added = 0;
                    list.forEach(rec => {
                        if (!rec || !rec.title) return;
                        if (!rec.id) rec.id = 'manual-' + Date.now() + '-' + added;
                        if (!records.some(r => r.id === rec.id)) {
                            records.push(Object.assign({
                                watchedDate: nowDateStr(),
                                timestamp: Date.now()
                            }, rec));
                            added++;
                        }
                    });
                    saveRecords(records);
                    renderSaved();
                    alert(`导入完成：新增 ${added} 条记录`);
                } catch (err) {
                    alert('JSON 文件解析失败');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // ========== 导航菜单切换 ==========
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');
        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });
            document.querySelectorAll('.nav-link').forEach(n => n.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            }));
        }

        // ========== 初始化 ==========
        renderSaved();
    </script>
</body>
</html>
