<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视剧观影存储时间胶囊 - 工具箱</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Host+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
    <style>
        .tool-container {
            max-width: 1240px;
            margin: 5rem auto;
            padding: 0 1.5rem 2rem;
        }

        /* ========== 顶部：标题 + 爱奇艺风格搜索栏 ========== */
        .tool-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1.5rem 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: var(--ds-font-display);
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--ds-text-primary);
            letter-spacing: -0.01em;
        }

        .brand i {
            color: var(--ds-brand);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--ds-bg-surface-1);
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-pill);
            padding: 0.35rem 0.35rem 0.35rem 1.1rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            width: min(480px, 100%);
        }

        .search-bar:focus-within {
            border-color: var(--ds-brand);
            box-shadow: 0 0 0 3px rgba(77, 107, 254, .15);
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-family: var(--ds-font-sans);
            color: var(--ds-text-primary);
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--ds-text-placeholder);
        }

        .search-bar button {
            background: var(--ds-brand);
            color: #fff;
            border: none;
            border-radius: var(--ds-radius-pill);
            padding: 0.55rem 1.5rem;
            font-size: 0.92rem;
            font-weight: 600;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .search-bar button:hover {
            background: #3f5eea;
        }

        .search-bar button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ========== 分类导航（爱奇艺风格频道栏） ========== */
        .category-nav {
            position: sticky;
            top: 68px;
            z-index: 60;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            padding: 0.6rem 1rem;
            background: var(--ds-bg-page);
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-panel);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .cat-tab {
            padding: 0.4rem 1.1rem;
            border: none;
            border-radius: var(--ds-radius-pill);
            background: transparent;
            color: var(--gray-500);
            font-size: 0.92rem;
            font-weight: 500;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .cat-tab:hover {
            color: var(--ds-text-primary);
            background: var(--ds-bg-surface-1);
        }

        .cat-tab.active {
            background: var(--ds-brand);
            color: #fff;
        }

        .nav-divider {
            width: 1px;
            height: 18px;
            background: var(--ds-border-strong);
            margin: 0 0.4rem;
        }

        .genre-tabs {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .genre-chip {
            padding: 0.3rem 0.9rem;
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-pill);
            background: var(--ds-bg-surface-1);
            color: var(--gray-600);
            font-size: 0.82rem;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .genre-chip:hover {
            border-color: var(--ds-border-hover);
            color: var(--ds-text-primary);
        }

        .genre-chip.active {
            background: var(--ds-brand);
            border-color: var(--ds-brand);
            color: #fff;
        }

        .nav-actions {
            margin-left: auto;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .ghost-btn {
            padding: 0.45rem 1rem;
            background: transparent;
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-pill);
            color: var(--gray-600);
            font-size: 0.85rem;
            font-weight: 500;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .ghost-btn:hover {
            border-color: var(--ds-border-hover);
            color: var(--ds-text-primary);
            background: var(--ds-bg-surface-1);
        }

        /* ========== 搜索结果 ========== */
        .search-results {
            margin-bottom: 1.5rem;
        }

        .section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .section-label h2 {
            font-family: var(--ds-font-display);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--ds-text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-status {
            font-size: 0.9rem;
            color: var(--gray-500);
        }

        .search-status.error {
            color: var(--danger-color);
        }

        /* ========== 海报卡片（爱奇艺风格） ========== */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.1rem;
        }

        .poster-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: var(--ds-bg-surface-1);
            border: 1px solid var(--ds-border-subtle);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .poster-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, .12);
            border-color: var(--ds-border-hover);
        }

        .poster-wrap {
            position: relative;
            aspect-ratio: 2 / 3;
            background: var(--ds-bg-surface-3);
            overflow: hidden;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .poster-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .55) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0.9rem;
            opacity: 0;
            transition: opacity .25s ease;
        }

        .poster-card:hover .poster-overlay {
            opacity: 1;
        }

        .card-btn {
            padding: 0.45rem 1.1rem;
            background: var(--ds-brand);
            color: #fff;
            border: none;
            border-radius: var(--ds-radius-pill);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
        }

        .card-btn:hover {
            background: #3f5eea;
            transform: scale(1.04);
        }

        .card-btn.danger {
            background: rgba(255, 95, 87, .9);
        }

        .card-btn.danger:hover {
            background: #ff5f57;
        }

        .card-btn.recorded {
            background: var(--ds-bg-surface-3);
            color: var(--gray-500);
            cursor: default;
            box-shadow: none;
        }

        .poster-info {
            padding: 0.55rem 0.65rem 0.7rem;
        }

        .poster-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ds-text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .poster-meta {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
            font-size: 0.78rem;
            color: var(--gray-500);
            margin-top: 0.25rem;
        }

        .poster-meta .tag {
            background: var(--ds-bg-surface-3);
            border: 1px solid var(--ds-border-subtle);
            padding: 0.05rem 0.5rem;
            border-radius: var(--ds-radius-pill);
            font-size: 0.72rem;
            color: var(--gray-600);
        }

        .date-edit {
            border: 1px solid var(--ds-border-subtle);
            background: var(--ds-bg-page);
            color: var(--gray-600);
            border-radius: 6px;
            padding: 0.1rem 0.35rem;
            font-size: 0.76rem;
            font-family: var(--ds-font-sans);
            cursor: pointer;
            max-width: 118px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            color: var(--gray-400);
            border: 1px dashed var(--ds-border-strong);
            border-radius: var(--ds-radius-panel);
            margin-top: 0.5rem;
        }

        .empty-state i {
            font-size: 2.6rem;
            margin-bottom: 0.75rem;
            color: var(--ds-brand-light);
            opacity: .6;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        .hidden {
            display: none !important;
        }

        /* ========== 手动添加表单 ========== */
        .manual-form {
            display: grid;
            grid-template-columns: 1.4fr 0.7fr 0.7fr 0.9fr 1fr auto;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            background: var(--ds-bg-surface-1);
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-panel);
            box-shadow: var(--shadow-sm);
            align-items: center;
        }

        .manual-form input,
        .manual-form select {
            padding: 0.6rem 0.85rem;
            background: var(--ds-bg-page);
            border: 1px solid var(--ds-border-subtle);
            border-radius: var(--ds-radius-input);
            font-size: 0.9rem;
            font-family: var(--ds-font-sans);
            color: var(--ds-text-primary);
            transition: var(--transition);
        }

        .manual-form input:focus,
        .manual-form select:focus {
            outline: none;
            border-color: var(--ds-brand);
            box-shadow: 0 0 0 3px rgba(77, 107, 254, .15);
        }

        .manual-form select {
            cursor: pointer;
        }

        .tip {
            font-size: 0.78rem;
            color: var(--gray-400);
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .tool-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-bar {
                width: 100%;
            }

            .category-nav {
                position: static;
                gap: 0.3rem;
            }

            .nav-actions {
                margin-left: 0;
                width: 100%;
            }

            .manual-form {
                grid-template-columns: 1fr 1fr;
            }

            .poster-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 0.8rem;
            }
        }
    </style>
</head>

    <script>
        // ===================== 数据存储 =====================
        const STORAGE_KEY = 'movieTimeCapsule';

        function loadRecords() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return Array.isArray(data) ? data : [];
            } catch (e) {
                return [];
            }
        }

        function saveRecords(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function nowDateStr() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        // ===================== 百度百科搜索（JSONP 加载，无需 CORS/代理） =====================
        function extractYear(s) {
            const m = s.match(/(?:19|20)\d{2}/);
            return m ? m[0] : '';
        }

        function detectType(s) {
            // 小说 / 漫画等非影视条目
            if (/创作.{0,8}?(小说|漫画)|系列小说|轻小说|长篇漫画/.test(s)) return 'other';
            // 综艺
            if (/综艺|真人秀|脱口秀|选秀|访谈节目/.test(s)) return 'variety';
            // 动画电影归为电影，纯动画/动漫归为动漫
            if (/动画电影/.test(s)) return 'movie';
            if (/动画|动漫|番剧/.test(s)) return 'anime';
            // 电视剧（"执导/主演的...剧"，要求"剧"是类型词组末字，避免误匹配"剧情片"）
            if (/电视剧|网络剧|网剧|(?:执导|主演)的[\u4e00-\u9fa5]{0,10}?剧(?![一-龥])/.test(s)) return 'tv';
            // 电影
            if (/(?:执导|主演)的[\u4e00-\u9fa5]{0,10}?片|电影|影片/.test(s)) return 'movie';
            return 'movie';
        }

        // 从百科信息卡中提取类型（如：犯罪 剧情）
        function extractGenre(d) {
            const card = d.card || [];
            const entry = card.find(c => c.name === '类型');
            if (!entry || !entry.value || !entry.value[0]) return '';
            const raw = entry.value[0].replace(/<[^>]*>/g, '').replace(/\s+/g, ' ');
            const parts = raw.split(/[、，,]/).map(s => s.trim()).filter(Boolean);
            return parts.slice(0, 3).join(' ');
        }

        // 生成百度 CDN 缩略图 URL（限宽 300px）
        function thumbnailize(imgUrl) {
            if (!imgUrl) return '';
            const base = imgUrl.split('?')[0];
            return base + '?x-bce-process=image/resize,w_300,limit_1/format,f_auto';
        }

        // JSONP 加载器：通过 <script> 标签请求，绕过 CORS 限制
        function jsonp(url, cbParam, timeout, charset) {
            return new Promise((resolve, reject) => {
                const cb = 'bkcb' + Date.now() + Math.floor(Math.random() * 1000);
                const script = document.createElement('script');
                if (charset) script.charset = charset;
                const timer = setTimeout(() => {
                    delete window[cb];
                    script.remove();
                    reject(new Error('请求超时'));
                }, timeout || 12000);
                window[cb] = (data) => {
                    clearTimeout(timer);
                    delete window[cb];
                    script.remove();
                    resolve(data);
                };
                script.onerror = () => {
                    clearTimeout(timer);
                    delete window[cb];
                    script.remove();
                    reject(new Error('加载失败'));
                };
                script.src = url + '&' + cbParam + '=' + cb;
                document.head.appendChild(script);
            });
        }

        // 搜索百度百科词条（先用建议词接口，再逐个查详情）
        async function searchBaidu(keyword) {
            // 1. 获取建议词（该接口返回 GBK 编码，强制按 GBK 解码）
            const sug = await jsonp(
                'https://suggestion.baidu.com/su?wd=' + encodeURIComponent(keyword) + '&prod=baike',
                'cb',
                12000,
                'gbk'
            );
            const names = (sug && sug.s) || [];
            if (!names.length) return [];
            const candidates = [...new Set(names)].slice(0, 6);

            // 2. 并行查询每个词条详情（含海报、年份、类型、简介）
            const list = await Promise.all(candidates.map(async name => {
                try {
                    const d = await jsonp(
                        'https://baike.baidu.com/api/openapi/BaikeLemmaCardApi?scope=103&format=json&appid=379020'
                            + '&bk_key=' + encodeURIComponent(name) + '&bk_length=300',
                        'callback'
                    );
                    if (!d || !d.title) return null;
                    const text = (d.desc || '') + ' ' + (d.abstract || '');
                    return {
                        id: 'baike-' + d.id,
                        title: d.title,
                        year: extractYear(text),
                        type: detectType(text),
                        url: d.url || 'https://baike.baidu.com/item/' + encodeURIComponent(d.title),
                        img: thumbnailize(d.image),
                        genre: extractGenre(d),
                        sub_title: '',
                        desc: (d.abstract || d.desc || '').slice(0, 140)
                    };
                } catch (e) {
                    return null;
                }
            }));
            return list.filter(Boolean);
        }

        async function searchMovies(keyword) {
            const list = await searchBaidu(keyword);
            if (list.length === 0) {
                throw new Error('百度百科没有找到相关词条，可更换关键词或手动添加');
            }
            return list;
        }

        // ===================== 页面逻辑 =====================
        let records = loadRecords();
        let currentCat = 'all';   // all / movie / tv
        let currentGenre = '';    // 当前选中的类型

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const searchStatus = document.getElementById('search-status');
        const searchResults = document.getElementById('search-results');
        const resultsGrid = document.getElementById('results-grid');
        const savedList = document.getElementById('saved-list');
        const emptyState = document.getElementById('empty-state');
        const savedCount = document.getElementById('saved-count');
        const genreTabs = document.getElementById('genre-tabs');

        function typeName(t) {
            return { movie: '电影', tv: '电视剧', variety: '综艺', anime: '动漫', other: '其他' }[t] || '电影';
        }

        // 海报加载失败时替换为占位图标
        function posterError(el) {
            el.onerror = null;
            const holder = document.createElement('div');
            holder.className = 'poster-wrap';
            holder.style.cssText = 'display:flex;align-items:center;justify-content:center;color:var(--gray-400);aspect-ratio:2/3;';
            holder.innerHTML = '<i class="fas fa-film" style="font-size:2.2rem;"></i>';
            el.parentNode.replaceChild(holder, el);
        }

        // ========== 分类过滤 ==========
        function filteredRecords() {
            return records.filter(r => {
                if (currentCat !== 'all' && r.type !== currentCat) return false;
                if (currentGenre) {
                    const g = (r.genre || '').split(/\s+/).filter(Boolean);
                    if (!g.includes(currentGenre)) return false;
                }
                return true;
            });
        }

        function renderGenreTabs() {
            const genres = [...new Set(records.flatMap(r => (r.genre || '').split(/\s+/).filter(Boolean)))].slice(0, 12);
            genreTabs.innerHTML = genres.map(g =>
                `<button class="genre-chip ${g === currentGenre ? 'active' : ''}" data-genre="${g}">${g}</button>`
            ).join('');
            genreTabs.querySelectorAll('.genre-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    currentGenre = chip.dataset.genre === currentGenre ? '' : chip.dataset.genre;
                    renderGenreTabs();
                    renderSaved();
                });
            });
        }

        // ========== 渲染已存片单（爱奇艺风格海报墙） ==========
        function renderSaved() {
            renderGenreTabs();
            const list = filteredRecords();
            list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            savedCount.textContent = records.length;

            if (records.length === 0) {
                savedList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            if (list.length === 0) {
                savedList.innerHTML = `<div class="empty-state" style="grid-column:1/-1;border:none;">
                    <i class="fas fa-filter"></i><p>当前分类下没有记录</p></div>`;
                return;
            }

            savedList.innerHTML = list.map((r, i) => `
                <div class="poster-card" data-idx="${i}">
                    <div class="poster-wrap">
                        ${r.img
                            ? `<img class="poster-img" src="${r.img}" alt="${r.title}" loading="lazy" referrerpolicy="no-referrer" onerror="posterError(this)">`
                            : `<div style="display:flex;align-items:center;justify-content:center;color:var(--gray-400);width:100%;height:100%;"><i class="fas fa-film" style="font-size:2.2rem;"></i></div>`}
                        <div class="poster-overlay">
                            <button class="card-btn danger" data-del="${i}" title="删除记录"><i class="fas fa-trash-alt"></i> 删除</button>
                        </div>
                    </div>
                    <div class="poster-info">
                        <div class="poster-title" title="${r.title}">${r.title || '未命名'}</div>
                        <div class="poster-meta">
                            <span class="tag">${typeName(r.type)}</span>
                            ${r.year ? `<span>${r.year}</span>` : ''}
                            ${r.genre ? `<span>${r.genre}</span>` : ''}
                        </div>
                        <div class="poster-meta">
                            <i class="fas fa-calendar-alt"></i>
                            <input type="date" class="date-edit" value="${r.watchedDate || ''}" data-date="${i}">
                        </div>
                    </div>
                </div>
            `).join('');

            savedList.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const i = parseInt(btn.dataset.del);
                    if (confirm('确定删除这条观影记录吗？')) {
                        records.splice(i, 1);
                        saveRecords(records);
                        renderSaved();
                    }
                });
            });

            savedList.querySelectorAll('.date-edit').forEach(inp => {
                inp.addEventListener('change', () => {
                    const i = parseInt(inp.dataset.date);
                    records[i].watchedDate = inp.value;
                    saveRecords(records);
                });
            });
        }

        // ========== 渲染搜索结果（爱奇艺风格海报墙） ==========
        function renderResults(list) {
            if (!list.length) {
                resultsGrid.innerHTML = '';
                searchResults.classList.add('hidden');
                searchStatus.textContent = '没有找到相关词条，可手动添加。';
                searchStatus.className = 'search-status error';
                return;
            }
            searchResults.classList.remove('hidden');
            searchStatus.className = 'search-status';
            searchStatus.textContent = `找到 ${list.length} 条结果（百度百科）`;

            resultsGrid.innerHTML = list.map((item, idx) => {
                const recorded = records.some(r => r.id === String(item.id));
                return `
                <div class="poster-card">
                    <div class="poster-wrap">
                        ${item.img
                            ? `<img class="poster-img" src="${item.img}" alt="${item.title}" loading="lazy" referrerpolicy="no-referrer" onerror="posterError(this)">`
                            : `<div style="display:flex;align-items:center;justify-content:center;color:var(--gray-400);width:100%;height:100%;"><i class="fas fa-film" style="font-size:2.2rem;"></i></div>`}
                        <div class="poster-overlay">
                            <button class="card-btn ${recorded ? 'recorded' : ''}" data-record="${idx}" ${recorded ? 'disabled' : ''}>
                                ${recorded ? '已记录' : '记录观看'}
                            </button>
                        </div>
                    </div>
                    <div class="poster-info">
                        <div class="poster-title" title="${item.title}">${item.title}</div>
                        <div class="poster-meta">
                            <span class="tag">${typeName(item.type)}</span>
                            ${item.year ? `<span>${item.year}</span>` : ''}
                            ${item.genre ? `<span>${item.genre}</span>` : ''}
                        </div>
                        ${item.desc ? `<div class="poster-meta" title="${item.desc}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.desc}</div>` : ''}
                    </div>
                </div>`;
            }).join('');

            resultsGrid.querySelectorAll('.card-btn:not(.recorded)').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = list[parseInt(btn.dataset.record)];
                    addRecord({
                        id: String(item.id),
                        title: item.title || '未知作品',
                        year: item.year || '',
                        type: item.type === 'tv' ? 'tv' : 'movie',
                        url: item.url || '',
                        img: item.img || '',
                        genre: item.genre || '',
                        sub_title: item.sub_title || '',
                        desc: item.desc || ''
                    });
                    btn.classList.add('recorded');
                    btn.textContent = '已记录';
                    btn.disabled = true;
                });
            });
        }

        function addRecord(rec) {
            const record = Object.assign({
                id: 'manual-' + Date.now(),
                title: '',
                year: '',
                type: 'movie',
                url: '',
                img: '',
                genre: '',
                sub_title: '',
                desc: '',
                note: '',
                watchedDate: nowDateStr(),
                timestamp: Date.now()
            }, rec);
            if (!record.watchedDate) record.watchedDate = nowDateStr();
            if (!record.timestamp) record.timestamp = Date.now();

            if (!records.some(r => r.id === record.id)) {
                records.push(record);
            }
            saveRecords(records);
            renderSaved();
        }

        // ========== 搜索 ==========
        async function doSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                searchStatus.textContent = '请输入影视剧名称';
                searchStatus.className = 'search-status error';
                return;
            }
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 搜索中';
            searchStatus.textContent = '正在搜索百度百科...';
            searchStatus.className = 'search-status';
            searchResults.classList.remove('hidden');

            try {
                const list = await searchMovies(keyword);
                renderResults(list);
            } catch (e) {
                searchResults.classList.remove('hidden');
                searchStatus.className = 'search-status error';
                searchStatus.textContent = e.message || '搜索失败';
                resultsGrid.innerHTML = '';
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fas fa-search"></i> 搜索';
            }
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        // 关闭搜索结果
        document.getElementById('close-search').addEventListener('click', () => {
            searchResults.classList.add('hidden');
            resultsGrid.innerHTML = '';
        });

        // ========== 分类切换 ==========
        document.getElementById('category-nav').addEventListener('click', e => {
            const tab = e.target.closest('.cat-tab');
            if (!tab) return;
            currentCat = tab.dataset.cat;
            currentGenre = '';
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t === tab));
            renderGenreTabs();
            renderSaved();
        });

        // ========== 手动添加 ==========
        document.getElementById('toggle-manual').addEventListener('click', () => {
            document.getElementById('manual-form').classList.toggle('hidden');
        });

        document.getElementById('m-save').addEventListener('click', () => {
            const title = document.getElementById('m-title').value.trim();
            if (!title) {
                alert('请填写名称');
                return;
            }
            addRecord({
                id: 'manual-' + Date.now(),
                title: title,
                year: document.getElementById('m-year').value.trim(),
                type: document.getElementById('m-type').value,
                genre: document.getElementById('m-genre').value.trim(),
                note: document.getElementById('m-note').value.trim()
            });
            document.getElementById('m-title').value = '';
            document.getElementById('m-year').value = '';
            document.getElementById('m-genre').value = '';
            document.getElementById('m-note').value = '';
            document.getElementById('manual-form').classList.add('hidden');
        });

        // ========== 导出 / 导入 JSON ==========
        document.getElementById('export-btn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `观影时间胶囊_${nowDateStr()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });

        document.getElementById('import-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    const list = Array.isArray(data) ? data : (data.records || []);
                    let added = 0;
                    list.forEach(rec => {
                        if (!rec || !rec.title) return;
                        if (!rec.id) rec.id = 'manual-' + Date.now() + '-' + added;
                        if (!records.some(r => r.id === rec.id)) {
                            records.push(Object.assign({
                                watchedDate: nowDateStr(),
                                timestamp: Date.now()
                            }, rec));
                            added++;
                        }
                    });
                    saveRecords(records);
                    renderSaved();
                    alert(`导入完成：新增 ${added} 条记录`);
                } catch (err) {
                    alert('JSON 文件解析失败');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // ========== 导航菜单切换 ==========
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');
        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });
            document.querySelectorAll('.nav-link').forEach(n => n.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            }));
        }

        // ========== 初始化 ==========
        renderSaved();
    </script>
</body>
</html>
