<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9ef"><title>热搜清屏 · 把噪声扫开</title><link rel="stylesheet" href="hotsearch-reaping/style.css"></head><body>
<div id="app"><header class="app-header"><a href="index.html" aria-label="返回工具页">‹</a><div><h1>热搜清屏<span>✦</span></h1><small>把噪声扫开，让讨论留下</small></div><button data-action="wallet" class="wallet">☀ <b id="coins">0</b></button></header>
<main><section id="hot-view" class="view"><div class="home-hero"><div><small>HOT TOPICS · CLEAR THE NOISE</small><h2>今天的热搜<br>由你来清屏</h2><p>自动巡航 · 密集清场 · 舆论风暴</p><button data-action="campaign" class="primary">开始守望 ↗</button></div><canvas id="home-portrait" width="240" height="260" aria-hidden="true"></canvas></div>
<div id="ongoing" class="ongoing" hidden></div><div class="feed-title"><h2 id="feed-heading"><span>◉</span> 微博热搜</h2><button data-action="refresh" id="refresh-feed">↻ 刷新</button></div><div class="feed-source"><span id="feed-source">正在读取公开榜单…</span><a href="https://s.weibo.com/top/summary?cate=realtimehot" target="_blank" rel="noopener noreferrer">官方榜 ↗</a></div><div class="feed-tabs"><button data-board="real" class="selected">热搜榜</button><button data-board="game">游戏战报</button><button data-board="training">固定战役</button></div><div class="search-row"><input id="search" type="search" placeholder="搜索热搜话题" aria-label="搜索热搜话题"><button data-action="favorites" id="favorites-filter">☆ 收藏</button></div><div id="rank-list" class="rank-list"></div><p class="source-note">话题来自公开榜单；噪声怪与清屏结果属于游戏模拟。</p></section>
<section id="battle-view" class="view" hidden><div class="battle-heading"><div><small id="battle-kind">固定战役 · 晴芽广场</small><h2 id="battle-topic">选择话题，进入清屏战场</h2></div><button data-action="bag" aria-label="查看当前武器">▦</button></div><div class="battle-top"><div class="clarity"><span>清晰度 <b id="hp-text">—</b></span><div class="bar"><i id="hp-bar"></i></div></div><div class="battle-timer"><b id="wave">准备中</b><small id="timer">00:00</small></div><button data-action="pause" id="pause" aria-label="暂停战斗">Ⅱ</button></div>
<div class="arena"><canvas id="arena" width="840" height="1080" aria-label="俯视割草战场"></canvas><div class="arena-tags"><span id="kills">清屏 0</span><span id="combo">连击 ×0</span></div><div id="boss-hud" class="boss-hud" hidden><b id="boss-name"></b><div class="bar"><i id="boss-bar"></i></div></div><div id="battle-banner" class="battle-banner" hidden></div><div id="joy" class="joystick" aria-label="移动摇杆"><div id="stick"></div><small>移动</small></div><div class="skill-buttons"><button data-skill="verify" id="verify"><b>▤</b><span>查证</span><small>25上下文</small></button><button data-skill="cool" id="cool"><b>❄</b><span>降温</span><small>就绪</small></button><button data-skill="dash" id="dash"><b>»</b><span>闪避</span><small>就绪</small></button><button data-skill="pin" id="pin" class="ult"><b>✦</b><span>置顶</span><small>0%</small></button></div><button data-action="fullscreen" class="fullscreen" aria-label="全屏">⛶</button></div>
<div class="battle-meters"><div><span>上下文 <b id="context-text">0</b></span><div class="bar context"><i id="context-bar"></i></div></div><div><span>噪声压力 <b id="pressure-text">0</b></span><div class="bar pressure"><i id="pressure-bar"></i></div></div><canvas id="pressure-chart" width="130" height="45" aria-label="游戏噪声压力走势"></canvas></div><div class="combat-controls"><button data-action="auto" id="auto" class="active">自动走位</button><button data-action="autoSkill" id="auto-skill" class="active">自动技能</button><button data-action="policy" id="policy">优先清源</button><button data-action="speed" id="speed">1×</button></div><div class="combat-controls secondary"><button data-action="advance" id="advance">自动推进</button><button data-action="campaign">选择战役</button><button data-action="endless">无尽风暴</button></div><p id="battle-tip" class="source-note">摇杆松开后恢复自动走位。查证破盾，降温压制，置顶清场。</p></section>
<section id="workshop-view" class="view" hidden></section><section id="archive-view" class="view" hidden></section><section id="settings-view" class="view" hidden></section></main>
