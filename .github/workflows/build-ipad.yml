name: Build iPad IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode 构建配置
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  push:
    paths:
      - .github/workflows/build-ipad.yml
      - ios/**
      - tools/MovieTimeCapsule.html
      - tools/movieTimeCapsule.json
      - styles.css

permissions:
  contents: read

jobs:
  build:
    name: Build iLoader-ready iPad IPA
    runs-on: macos-26
    env:
      APP_SCHEME: MovieTimeCapsule
      PROJECT_PATH: ios/MovieTimeCapsule/MovieTimeCapsule.xcodeproj
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.3 toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks

      - name: Validate project resources
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_PATH/project.pbxproj"
          test -f ios/MovieTimeCapsule/MovieTimeCapsule/Resources/tools/MovieTimeCapsule.html
          test -f ios/MovieTimeCapsule/MovieTimeCapsule/Resources/tools/movieTimeCapsule.json
          test -f ios/MovieTimeCapsule/MovieTimeCapsule/Resources/tools/ipad-overrides.css
          test -f ios/MovieTimeCapsule/MovieTimeCapsule/Resources/styles.css

      - name: Sync web resources
        shell: bash
        run: |
          set -euo pipefail
          resources_dir="ios/MovieTimeCapsule/MovieTimeCapsule/Resources"
          mkdir -p "$resources_dir/tools"
          cp styles.css "$resources_dir/styles.css"
          cp tools/MovieTimeCapsule.html "$resources_dir/tools/MovieTimeCapsule.html"
          cp tools/movieTimeCapsule.json "$resources_dir/tools/movieTimeCapsule.json"

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipad-derived-data" "$RUNNER_TEMP/Payload"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$APP_SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/ipad-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Prepare app for third-party re-signing
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/ipad-derived-data/Build/Products/${CONFIGURATION}-iphoneos/MovieTimeCapsule.app"
          plist_path="$app_path/Info.plist"
          executable_path="$app_path/MovieTimeCapsule"
          test -d "$app_path"
          test -f "$plist_path"
          test -f "$executable_path"
          test ! -e "$app_path/Resources"
          test -f "$app_path/styles.css"
          test -f "$app_path/tools/MovieTimeCapsule.html"
          test -f "$app_path/tools/movieTimeCapsule.json"
          test -f "$app_path/tools/ipad-overrides.css"
          /usr/bin/plutil -lint "$plist_path"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist_path")"
          test "$bundle_id" = "com.xiaolizi.timecapsule.ipad"
          sdk_name="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$plist_path")"
          platform_version="$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformVersion' "$plist_path")"
          case "$sdk_name" in
            iphoneos26.*) ;;
            *) echo "Expected an iOS 26 SDK, got: $sdk_name" >&2; exit 1 ;;
          esac
          echo "Bundle ID: $bundle_id"
          echo "SDK: $sdk_name (platform $platform_version)"

          # iLoader/isideload needs a Mach-O code-signature load command that it can replace.
          # A CODE_SIGNING_ALLOWED=NO build has no LC_CODE_SIGNATURE, so add a temporary
          # ad-hoc signature. iLoader will replace this signature with the user's profile.
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$app_path"
          /usr/bin/codesign --verify --deep --strict "$app_path"
          /usr/bin/codesign -dvvv "$app_path" 2>&1
          /usr/bin/otool -l "$executable_path" | /usr/bin/grep -q LC_CODE_SIGNATURE

      - name: Package re-sign-ready IPA with fresh staging name
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/ipad-derived-data/Build/Products/${CONFIGURATION}-iphoneos/MovieTimeCapsule.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/Payload/TimeCapsuleIPadFixed.app"
          (cd "$RUNNER_TEMP" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/TimeCapsule-iPad-fixed.ipa" Payload)
          shasum -a 256 "$GITHUB_WORKSPACE/TimeCapsule-iPad-fixed.ipa" > "$GITHUB_WORKSPACE/TimeCapsule-iPad-fixed.ipa.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: TimeCapsule-iPad-fixed-${{ github.run_number }}
          path: |
            TimeCapsule-iPad-fixed.ipa
            TimeCapsule-iPad-fixed.ipa.sha256
          if-no-files-found: error
          retention-days: 14
